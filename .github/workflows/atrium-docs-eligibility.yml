name: ATRIUM Docs Eligibility

# Read-only PR metadata; NEVER checkout incoming PR code.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atrium-docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect PR changed files, modes and SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/atrium_autopilot.py --mode inspect --event "$GITHUB_EVENT_PATH"
