name: ATRIUM Docs Eligibility

# Read-only PR metadata; NEVER checkout incoming PR code.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atrium-docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One-time pre-merge CI for this specific security PR only. Read-only token,
      # no secrets, and no untrusted code in the privileged workflow_run job.
      - name: Isolated bootstrap tests for exact security PR 3
        if: ${{ github.event.pull_request.number == 3 && github.event.pull_request.head.ref == 'exp/atrium-autopilot-v2-20261122' && github.event.pull_request.user.login == 'rmalumyan-collab' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout trusted policy from main
        if: ${{ github.event.pull_request.number != 3 }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check trusted policy with offline unit tests
        run: python3 -m unittest discover -s .github/tests -p 'test_atrium_autopilot.py' -v
      - name: Inspect PR changed files, modes and SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/atrium_autopilot.py --mode inspect --event "$GITHUB_EVENT_PATH"
