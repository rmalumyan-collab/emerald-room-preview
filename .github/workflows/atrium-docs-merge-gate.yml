name: ATRIUM Docs Merge Gate

# Elevated token used only with trusted default-branch script. No PR code execution.
on:
  workflow_run:
    workflows: ["ATRIUM Docs Eligibility"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: atrium-docs-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  docs-merge:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted default branch policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify exact PR, Git tree, author, checks and merge if eligible
        env:
          GH_TOKEN: ${{ github.token }}
          ATRIUM_ENABLE_DOCS_MERGE: 'true'
        run: python3 .github/scripts/atrium_autopilot.py --mode merge --event "$GITHUB_EVENT_PATH"
